<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Components & Templates</title>
</head>
<body>

    <header>
        <h1>Reusable Profile Cards</h1>

        <nav>

            <a href="https://github.com/Mello1306/HTML-Deep-Dive?tab=readme-ov-file">My HTML Repository</a>
            </br>

            <a href="https://mello1306.github.io/HTML-Deep-Dive/12-scripting-basics/">View Day 12 Project</a>

        </nav>

    </header>

    <main>

        <template id="profile-card-template">

            <div class="card" style="border: 2px solid #333; padding: 15px; margin: 10px; border-radius: 8px; width: 250px;">
                <h2 style="margin-top: 0;"><slot name="username">User Name</slot></h2>

                <p><strong>Role:</strong> <slot name="role">Student</slot></p>

                <p><strong>Team:</strong> <slot name="team">N/A</slot></p>

            </div>

        </template>

        <div id="profile-container"></div>
    </main>

    <script src="script13.js"></script>
</body>
</html>
