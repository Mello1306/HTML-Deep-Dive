<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tech Stack Survey</title>
</head>
<body>

    <header>
        <h1>Developer Survey 2026</h1>

        <p>Help us understand the tech trends at Scaler School of Technology</p>

        <hr>
    </header>

    <main>
        <form>
            <section>


                <h3>1. What is your preferred OS?</h3>
                <input type="radio" id="windows" name="os" value="windows">
                <label for="windows">Windows</label><br>

                <input type="radio" id="mac" name="os" value="mac">
                <label for="mac">MacOS</label><br>
                <input type="radio" id="linux" name="os" value="linux">
                <label for="linux">Linux</label>

            </section>


            <section>

                <h3>2. Which languages are you learning?</h3>
                <input type="checkbox" id="java" name="lang" value="java">
                <label for="java">Java</label><br>

                <input type="checkbox" id="python" name="lang" value="python">
                <label for="python">Python</label><br>
                <input type="checkbox" id="html" name="lang" value="html" checked>
                <label for="html">HTML (Mastered!)</label>

            </section>

            <section>
                <h3>3. Your Current Goal:</h3>
                <select name="goal" id="goal">
                    <option value="web">Web Development</option>

                    <option value="cp">Competitive Programming</option>


                    <option value="ds">Data Science</option>

                </select>
            </section>

            <section>
                <h3>4. Any advice for Runtime Terror?</h3>

                <textarea name="feedback" rows="4" cols="40" placeholder="Type your message here..."></textarea>

            </section>

            <br>

            <button type="submit">Submit Survey</button>
        </form>
    </main>

    <footer>
        <hr>
        
    </footer>

</body>
</html>
